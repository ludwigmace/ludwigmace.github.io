<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #0c0c0c;
      --bg-alt:      #141414;
      --text:        #c8c8c8;
      --text-bright: #f0f0f0;
      --text-dim:    #4a4a4a;
      --accent:      #4af626;
      --border:      #1e1e1e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.8;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .wrap {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Header ── */
    .site-header {
      padding: 48px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 52px;
    }

    .site-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-bright);
      display: inline;
    }

    .site-title::after {
      content: '_';
      color: var(--accent);
      animation: blink 1.1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .site-title a { color: inherit; }
    .site-title a:hover { color: var(--accent); text-decoration: none; }

    .site-nav { margin-top: 14px; font-size: 0.78rem; }
    .site-nav a { color: var(--text-dim); margin-right: 20px; }
    .site-nav a:hover { color: var(--accent); text-decoration: none; }

    /* ── Post list (home) ── */
    .post-list { }

    .post-item {
      margin-bottom: 40px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--border);
    }
    .post-item:last-child { border-bottom: none; }

    .post-item-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .post-item-title a { color: var(--text-bright); }
    .post-item-title a:hover { color: var(--accent); text-decoration: none; }

    .post-item-meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .post-item-excerpt {
      font-size: 0.875rem;
      color: var(--text);
    }

    /* ── Single post ── */
    .post-header { margin-bottom: 40px; }

    .post-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-bright);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .post-date { font-size: 0.72rem; color: var(--text-dim); }

    .post-content { font-size: 0.9rem; line-height: 1.9; }
    .post-content p { margin-bottom: 20px; }

    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4 {
      color: var(--text-bright);
      margin: 32px 0 12px;
      font-weight: 700;
    }
    .post-content h2 { font-size: 1.0rem; }
    .post-content h3 { font-size: 0.9rem; }

    .post-content ul,
    .post-content ol { margin: 0 0 20px 1.6em; }
    .post-content li { margin-bottom: 6px; }

    .post-content a { color: var(--accent); }

    .post-content code {
      background: var(--bg-alt);
      color: var(--accent);
      padding: 2px 6px;
      font-size: 0.85em;
      border-radius: 2px;
    }

    .post-content pre {
      background: var(--bg-alt);
      padding: 20px;
      overflow-x: auto;
      margin: 24px 0;
      border-left: 3px solid var(--accent);
      font-size: 0.8rem;
    }
    .post-content pre code { background: none; padding: 0; color: var(--text); }

    .post-content blockquote {
      border-left: 3px solid var(--border);
      padding-left: 18px;
      color: var(--text-dim);
      margin: 20px 0;
      font-style: italic;
    }

    /* ── Generic page ── */
    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 28px;
    }

    .page-content { font-size: 0.9rem; line-height: 1.9; }
    .page-content p { margin-bottom: 20px; color: var(--text); }
    .page-content a { color: var(--accent); }

    /* ── Footer ── */
    .site-footer {
      margin-top: 80px;
      padding: 24px 0 52px;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    /* ── 404 ── */
    .error-code {
      font-size: 4rem;
      font-weight: 700;
      color: var(--text-bright);
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-msg { font-size: 0.9rem; color: var(--text); }
    .error-msg a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="site-title"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></div>
      <nav class="site-nav">
        <a href="{{ "/" | relative_url }}">home</a>
        <a href="{{ "/about/" | relative_url }}">about</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      &copy; {{ site.title | downcase }} &mdash; built with jekyll
    </footer>
  </div>
</body>
</html>
