---
layout: default
---

<div class="post-list">
  {% for post in site.posts %}
  <article class="post-item">
    <h2 class="post-item-title">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h2>
    <div class="post-item-meta">{{ post.date | date: "%Y-%m-%d" }}</div>
    <div class="post-item-excerpt">{{ post.excerpt | strip_html | truncatewords: 40 }}</div>
  </article>
  {% endfor %}
</div>
